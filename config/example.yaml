# Example configuration only.
# Do not put passwords, private keys or other secrets in this file.

kvm:
  host: 192.168.1.100
  username: root
  ssh_key: ~/.ssh/id_ed25519

vm:
  name: ubuntu-test01
  hostname: ubuntu-test01
  cpu: 4
  memory_gb: 8
  disk_gb: 50
  storage_pool: default

network:
  bridge: br851
  address: 192.168.1.50/24
  gateway: 192.168.1.1
  dns:
    - 192.168.1.10
    - 1.1.1.1

ubuntu:
  version: "24.04"

access:
  username: admin
  ssh_public_key: ~/.ssh/id_ed25519.pub
